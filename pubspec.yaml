name: app
description: PDFAI - one-tap AI processing for PDF files.
publish_to: 'none'

# Version and build number: raise BOTH with every release (format: version+build).
version: 0.4.0+4

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  pdfrx: ^2.0.0
  file_picker: ^8.1.2
  flutter_tesseract_ocr: ^0.4.30
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/tessdata_config.json
    - assets/tessdata/
  # Fonts are bundled (offline). Add the .ttf files to assets/fonts/ first
  # (see assets/fonts/README.md), then uncomment this block.
  # fonts:
  #   - family: NotoSansArabic
  #     fonts:
  #       - asset: assets/fonts/NotoSansArabic-Regular.ttf
  #       - asset: assets/fonts/NotoSansArabic-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/NotoSansArabic-Bold.ttf
  #         weight: 700
